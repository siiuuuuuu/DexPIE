<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="DexPIE favicon concept preview">
  <defs>
    <linearGradient id="preview-page-bg" x1="0" y1="0" x2="960" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="lettermark-bg-preview" x1="10" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.58" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172033" flood-opacity="0.14"/>
    </filter>

    <g id="icon-lettermark">
      <rect width="64" height="64" rx="14" fill="url(#lettermark-bg-preview)"/>
      <path d="M14 45V19h15.2c8.9 0 14.8 5.1 14.8 13s-5.9 13-14.8 13H14zm9.1-7.3h5.6c3.7 0 6.1-2.2 6.1-5.7s-2.4-5.7-6.1-5.7h-5.6v11.4z" fill="#fff"/>
      <path d="M39.8 45V27.6h13.8v5.5h-6.4V45h-7.4z" fill="#dffcf7"/>
      <circle cx="51.6" cy="20.2" r="4.1" fill="#facc15"/>
    </g>

    <g id="icon-robot-hand">
      <rect width="64" height="64" rx="14" fill="#0f172a"/>
      <path d="M22 35.5c0-3.1 2.5-5.6 5.6-5.6h8.8c3.1 0 5.6 2.5 5.6 5.6v9.2c0 3.1-2.5 5.6-5.6 5.6h-8.8c-3.1 0-5.6-2.5-5.6-5.6v-9.2z" fill="#e2e8f0"/>
      <path d="M25 30V17.8c0-2.1 1.7-3.8 3.8-3.8s3.8 1.7 3.8 3.8V30M32.8 30V15.3c0-2.1 1.7-3.8 3.8-3.8s3.8 1.7 3.8 3.8V31M40.4 34.8l4.3-10.6c.8-2 3.1-2.9 5-2.1s2.8 3 2 5L46.5 40M22.8 36.8l-5.7-5.9c-1.5-1.5-1.5-3.9 0-5.4s3.9-1.5 5.4.1l3.1 3.3" fill="none" stroke="#67e8f9" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28.8" cy="22.6" r="2.2" fill="#facc15"/>
      <circle cx="36.6" cy="22.6" r="2.2" fill="#facc15"/>
      <path d="M26.4 40.2h11.2M26.4 45.2h8" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <g id="icon-academic">
      <rect width="64" height="64" rx="14" fill="#f8fafc"/>
      <rect x="7" y="7" width="50" height="50" rx="11" fill="#fff" stroke="#1e293b" stroke-width="3"/>
      <path d="M18 43V20.5c4.8 0 9 .9 14 4.1 5-3.2 9.2-4.1 14-4.1V43c-4.9 0-9 .9-14 4.1-5-3.2-9.1-4.1-14-4.1z" fill="#e0f2fe" stroke="#0f172a" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M32 25v21.8M22.8 34.2c2.3.2 4.3.8 6.1 1.9M35.1 36.1c1.8-1.1 3.8-1.7 6.1-1.9" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20.5 48h23" fill="none" stroke="#14b8a6" stroke-width="4.2" stroke-linecap="round"/>
      <circle cx="48.6" cy="15.2" r="5.2" fill="#2563eb"/>
    </g>
  </defs>

  <rect width="960" height="360" fill="url(#preview-page-bg)"/>
  <text x="48" y="58" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">DexPIE favicon concepts</text>
  <text x="48" y="88" fill="#536174" font-family="Inter, Arial, sans-serif" font-size="15">Shown at large preview size, then 32px and 16px to judge browser-tab readability.</text>

  <g transform="translate(48 122)">
    <rect width="260" height="188" rx="8" fill="#fff" stroke="#d7dee9" filter="url(#soft-shadow)"/>
    <text x="24" y="36" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">01 Lettermark</text>
    <g transform="translate(24 60) scale(1.5)">
      <use href="#icon-lettermark"/>
    </g>
    <g transform="translate(148 91) scale(0.5)">
      <use href="#icon-lettermark"/>
    </g>
    <g transform="translate(204 99) scale(0.25)">
      <use href="#icon-lettermark"/>
    </g>
    <text x="24" y="168" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">Compact project-name mark</text>
  </g>

  <g transform="translate(350 122)">
    <rect width="260" height="188" rx="8" fill="#fff" stroke="#d7dee9" filter="url(#soft-shadow)"/>
    <text x="24" y="36" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">02 Robot hand</text>
    <g transform="translate(24 60) scale(1.5)">
      <use href="#icon-robot-hand"/>
    </g>
    <g transform="translate(148 91) scale(0.5)">
      <use href="#icon-robot-hand"/>
    </g>
    <g transform="translate(204 99) scale(0.25)">
      <use href="#icon-robot-hand"/>
    </g>
    <text x="24" y="168" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">Most robotics-specific</text>
  </g>

  <g transform="translate(652 122)">
    <rect width="260" height="188" rx="8" fill="#fff" stroke="#d7dee9" filter="url(#soft-shadow)"/>
    <text x="24" y="36" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">03 Academic</text>
    <g transform="translate(24 60) scale(1.5)">
      <use href="#icon-academic"/>
    </g>
    <g transform="translate(148 91) scale(0.5)">
      <use href="#icon-academic"/>
    </g>
    <g transform="translate(204 99) scale(0.25)">
      <use href="#icon-academic"/>
    </g>
    <text x="24" y="168" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">Clean paper-page feeling</text>
  </g>
</svg>
